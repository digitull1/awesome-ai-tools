<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>OffLadder motion</title>
<style>
/*FONTS*/
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0C0C0C; }
body { font-family: 'Hind', sans-serif; color: #0C0C0C; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.cam, .shaker, .world { transform-origin: 50% 50%; }
.pcanvas, .fx, .flash, .grain { pointer-events: none; }
.flash { opacity: 0; }
.grain { mix-blend-mode: overlay; }
.scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

/* Type. Masks carry padding so ascenders and tilted words aren't clipped. */
.display { font-family: 'Archivo Black', sans-serif; font-weight: 400; text-transform: uppercase; }
.body { font-family: 'Hind', sans-serif; font-weight: 600; }
.serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
.tbox, .mbox { position: absolute; }
.mask { overflow: hidden; padding: 0.14em 0.3em 0.06em; margin: -0.14em -0.3em -0.06em; }
.inner { display: block; white-space: nowrap; }
.word { display: inline-block; transform-origin: 0% 100%; }
.serif .mask { padding-bottom: 0.24em; margin-bottom: -0.24em; }

/* Highlight marks (the orange box from offladder.com) */
.mrow { display: block; margin-bottom: 0.16em; }
.mark { position: relative; display: inline-block; line-height: 1; }
.mbg, .msh { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
.msh { opacity: 0; }
.mmask { position: relative; overflow: hidden; }
.mtext { display: block; white-space: nowrap; padding: 0.16em 0.22em 0.04em; }

.stamp { position: absolute; font-family: 'Archivo Black', sans-serif; text-transform: uppercase; white-space: nowrap;
         border: 0.07em solid; padding: 0.14em 0.22em 0.02em; line-height: 1; }
.rung { position: absolute; left: 0; width: 1080px; }

/* Brand strip, always inside the Shorts safe area */
.hud { position: absolute; left: 72px; top: 196px; display: flex; align-items: center; gap: 20px; }
.hud .wm { font-family: 'Archivo Black', sans-serif; font-size: 50px; line-height: 1; letter-spacing: -0.01em; }
.hud .chip { font-family: 'Archivo Black', sans-serif; font-size: 26px; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 16px 9px; }

.roller { position: absolute; overflow: hidden; }
.rv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

.ch { position: relative; white-space: pre; }
.ch { --cur: 0; }
.ch::after { content: ''; position: absolute; left: 100%; top: 0.08em; width: 0.08em; height: 0.92em; margin-left: 0.04em; background: #FA5608; opacity: var(--cur); }
/*PIECECSS*/
</style>
</head>
<body>
<div id="stage"></div>
<script>/*VENDOR*/</script>
<script>/*KIT*/</script>
<script>/*PIECE*/</script>
</body>
</html>
